# dsh bundle patch: 把本插件插进 profile 的层栈。
#
# ★★★ 结论先说：**这份 patch 能让本包被加载，但没能让它接管压缩服务。**
#     2026-10-18 用 `tools/probe-service-order.mjs` 实测出来的，不是推测。
#
# ── 为什么 `insert` 不够 ─────────────────────────────────────
#
# cordis 的服务注册是**先到先得**：
#
#     Builtin → Mine     ⇒ ctx.compaction.who() === "builtin"   ← 先注册的赢
#     Mine → Builtin     ⇒ ctx.compaction.who() === "mine"      ← 先注册的赢
#
# 也就是说，同名 `Service` 并存时**先注册的那个占住名字，后来的那个不生效**。
# 而 profile 的层栈顺序是 `@deepseek-ai/dsh-base`（含 compaction-basic）在前，
# 我们的包是 `insert` 进来的，**排在后面** ⇒ 输。
#
# ★ 而 `update` 这条路本来就不存在（见下），于是「用 patch 换掉实现」两条路都封死。
#
# ── 那 patch 的语法到底长什么样 ──────────────────────────────
#
# 读 `@deepseek-ai/cordis-plugin-include/lib/index.js:68-104`：
#
# ```js
# const { id, insert, name, ...overrides } = patch;
# if (insert) { ...; continue; }
# if (!id) { warn("patch: id is required for non-insert patches"); continue; }
# const target = entryMap.get(id);
# if (name && name !== target.name) {
#   warn("patch: name mismatch for %C (expected %C, got %C), skipping"); continue;
# }
# for (const [key, value] of Object.entries(overrides)) target[key] = value;
# ```
#
# 三条由此确定：
#   ① **patch 是扁平的** —— 形状是 `{ id, name, ...overrides }`，**没有 `update` 关键字**。
#      写成 `- update: [...]` 会整个被当成一个叫 `update` 的 overrides 键，于是 `id` 为空
#      （实测报的正是 `patch: id is required for non-insert patches`）。
#   ② **`name` 不能改** —— 有一致性校验，和原条目不一致就 skip。
#   ③ 能改的只有 `config` 之类的**字段**，不是「换成另一个包」。
#
# ── 所以下面这段 `insert` 有什么用 ──────────────────────────
#
# 它让本包**被加载**（能 import、能构造），从而证明：
#   · package.json 的 `dsh.bundle.patch` 指对了
#   · patch 语法合法、不再报错
#   · 包能在真实 profile 里 import 进来
# ★ 但它**没能取代内置引擎**。别把「加载了」读成「生效了」。
#
# ── 下一个接手的人从这里开始（三个方向，都还没做）────────────
#
#   a) **把本包排到 base 之前**：改 profile 的 bundles 顺序，让本包先注册。
#      ★ 最干净，但要确认 DSH 尊重手写的 bundles 顺序（未验）。
#   b) **本包不去抢 `compaction` 这个名字**，改成注册一个新的服务名，
#      再由别处把调用指过来。★ 需要读 compaction 的调用点，改动面大。
#   c) **不用 insert，改 profile 层直接覆盖 base 的 patch 条目**。
#      ★ 要读 dsh-base 的 cordis.patch.yml 原文，且 DSH 升级会断。
#
#   ★ 验法统一用：`node tools/probe-service-order.mjs`（它就是为回答这个问题写的）。
- insert:
    - id: dsh-agent-compaction
      name: 'dsh-agent-compaction'
