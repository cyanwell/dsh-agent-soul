<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, maximum-scale=1">
<meta name="theme-color" content="#0b1220">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<title>砚青</title>
<style>
  :root{
    --bg:#0b1220; --bg2:#101a2c; --line:#1e2d47;
    --bub-ai:#1b2942; --bub-me:#1d4ed8;
    --txt:#e6edf7; --dim:#7f94b3;
    --ok:#38d39f; --warn:#f0b429; --err:#ef5b6b; --accent:#5ac8ff;
  }
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  html,body{height:100%;margin:0}
  body{
    background:var(--bg); color:var(--txt);
    font:16px/1.55 -apple-system,BlinkMacSystemFont,"PingFang SC","Microsoft YaHei",system-ui,sans-serif;
    display:flex; flex-direction:column; overscroll-behavior:none;
  }

  header{
    flex:0 0 auto; position:relative;
    padding:calc(env(safe-area-inset-top) + 9px) 12px 9px;
    background:linear-gradient(180deg,#0e1830,#0b1220);
    border-bottom:1px solid var(--line); text-align:center;
  }
  header .name{font-size:17px;font-weight:600;letter-spacing:.5px}
  header .sub{font-size:11.5px;color:var(--dim);margin-top:2px;display:flex;align-items:center;justify-content:center;gap:6px}
  .dot{width:7px;height:7px;border-radius:50%;background:var(--dim);flex:0 0 auto}
  .dot.ok{background:var(--ok);box-shadow:0 0 7px var(--ok)}
  .dot.warn{background:var(--warn)}
  .dot.err{background:var(--err)}
  header .btn{
    position:absolute; right:10px; top:calc(env(safe-area-inset-top) + 12px);
    background:var(--bg2); color:var(--txt); border:1px solid var(--line);
    border-radius:9px; padding:6px 10px; font-size:12.5px;
  }
  header .btn.on{background:#123a2e;border-color:#1d6b52;color:#8ff0cd}

  #log{flex:1 1 auto; overflow-y:auto; padding:12px 10px 8px; -webkit-overflow-scrolling:touch}
  .day{text-align:center; margin:12px 0 14px}
  .day span{background:#16233a; color:#93a6c4; font-size:11.5px; padding:3px 10px; border-radius:6px}

  .row{display:flex; align-items:flex-start; gap:9px; margin-bottom:14px}
  .row.me{flex-direction:row-reverse}

  .av{
    flex:0 0 auto; width:38px; height:38px; border-radius:7px;
    display:flex; align-items:center; justify-content:center;
    font-size:17px; font-weight:600; color:#dceaff; user-select:none;
  }
  .av.ai{background:linear-gradient(145deg,#1b3a63,#0f2138); border:1px solid #24405f}
  .av.me{background:linear-gradient(145deg,#3b2f52,#241d38); border:1px solid #4a3d66; color:#e8dcff}

  .bub{
    position:relative; max-width:calc(100% - 100px);
    padding:9px 12px; border-radius:9px; font-size:15.5px;
    white-space:pre-wrap; word-break:break-word;
  }
  .bub.ai{background:var(--bub-ai); border:1px solid var(--line)}
  .bub.me{background:var(--bub-me)}
  .bub::before{content:''; position:absolute; top:11px; width:0; height:0; border:5px solid transparent}
  .bub.ai::before{left:-9px; border-right-color:var(--bub-ai)}
  .bub.me::before{right:-9px; border-left-color:var(--bub-me)}
  .bub img{max-width:100%; max-height:320px; border-radius:6px; display:block; margin-bottom:4px}
  .bub.sys{max-width:100%; margin:0 auto; background:#241a3d; border:1px solid #3a2b5e; color:#cbb8ff; font-size:12.5px; border-radius:8px}
  .bub.sys::before{display:none}
  .row.sys{justify-content:center}
  .row.sys .bub{max-width:94%}
  .bub .meta{display:block; font-size:10.5px; color:#8fa4c4; margin-top:4px; text-align:right}
  .bub.me .meta{color:#c3d5f8}

  .spk{
    display:inline-flex; align-items:center; gap:6px; cursor:pointer;
    background:rgba(255,255,255,.07); border:0; color:inherit;
    border-radius:7px; padding:4px 9px; font-size:12.5px; margin-top:6px;
  }
  .spk:active{background:rgba(255,255,255,.16)}

  footer{
    flex:0 0 auto; padding:9px 10px calc(env(safe-area-inset-bottom) + 9px);
    border-top:1px solid var(--line); background:var(--bg2);
    display:flex; gap:8px; align-items:flex-end;
  }
  footer button.round{
    flex:0 0 auto; width:40px; height:40px; border-radius:50%;
    background:#17243c; color:var(--txt); border:1px solid var(--line);
    font-size:20px; line-height:1; display:flex; align-items:center; justify-content:center;
  }
  footer button.round:active{background:#20304f}
  #text{
    flex:1 1 auto; background:var(--bg); color:var(--txt);
    border:1px solid var(--line); border-radius:10px; padding:10px 12px;
    font:16px/1.4 inherit; resize:none; max-height:118px; min-height:40px;
  }
  #text:focus{outline:none;border-color:#2a4b7c}
  #send{flex:0 0 auto; background:var(--bub-me); color:#fff; border:0; border-radius:10px; padding:0 16px; height:40px; font-size:14.5px; font-weight:600}
  #send:disabled{opacity:.45}

  #plusmenu{display:none; padding:0 10px 9px; gap:8px; background:var(--bg2)}
  #plusmenu.on{display:flex}
  #plusmenu button{
    flex:1; font-size:13px; color:var(--txt); background:#17243c;
    border:1px solid var(--line); border-radius:10px; padding:13px 6px;
  }
  #plusmenu button:active{background:#20304f}

  #bar{padding:0 12px 7px; font-size:11.5px; color:var(--dim); display:flex; gap:11px; flex-wrap:wrap; background:var(--bg2)}
  #bar .k{color:var(--accent)}
  #up{position:absolute; left:-9999px; width:1px; height:1px; opacity:0}
</style>
</head>
<body>

<header>
  <div class="name">砚青</div>
  <div class="sub"><span class="dot" id="dot"></span><span id="sub">连接中…</span></div>
  <button class="btn on" id="spk">🔊</button>
</header>

<div id="log"></div>

<div id="plusmenu">
  <button id="pick-img">🖼 图片</button>
  <button id="pick-file">📎 文件</button>
  <button id="pick-last">📥 最近的</button>
</div>

<div id="bar">
  <span>容器 <span class="k" id="sess">—</span></span>
  <span>声线 <span class="k" id="tts">—</span></span>
</div>

<input type="file" id="up">

<footer>
  <button class="round" id="plus">+</button>
  <textarea id="text" rows="1" placeholder="跟砚青说点什么…"></textarea>
  <button id="send">发送</button>
</footer>

<audio id="au" preload="none"></audio>

<script>
const $ = (id) => document.getElementById(id)
const logEl = $('log'), textEl = $('text'), sendEl = $('send'), au = $('au'), upEl = $('up')
let since = 0, speakOn = true, busy = false, lastSpoken = '', lastDay = 0

function esc(s){ return String(s).replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c])) }
function hhmm(t){ const d = new Date(t); return String(d.getHours()).padStart(2,'0') + ':' + String(d.getMinutes()).padStart(2,'0') }
function dayLabel(t){
  const d = new Date(t), n = new Date()
  return (d.toDateString() === n.toDateString() ? '' : (d.getMonth()+1) + '月' + d.getDate() + '日 ') + hhmm(t)
}
function atBottom(){ return logEl.scrollHeight - logEl.scrollTop - logEl.clientHeight < 90 }
function toBottom(){ logEl.scrollTop = logEl.scrollHeight }

// 时间分节：跟微信一样，间隔超过 5 分钟才插一条居中的时间
function maybeDay(ts){
  if (ts - lastDay > 5 * 60 * 1000){
    const d = document.createElement('div')
    d.className = 'day'
    d.innerHTML = '<span>' + esc(dayLabel(ts)) + '</span>'
    logEl.appendChild(d)
  }
  lastDay = ts
}

function newBubble(kind, opts){
  opts = opts || {}
  const stick = atBottom()
  maybeDay(opts.ts || Date.now())
  const row = document.createElement('div')
  row.className = 'row ' + kind
  const av = document.createElement('div')
  av.className = 'av ' + kind
  av.textContent = kind === 'ai' ? '砚' : '爀'
  const b = document.createElement('div')
  b.className = 'bub ' + kind
  row.appendChild(av); row.appendChild(b)
  logEl.appendChild(row)
  return { b, stick }
}

function addMsg(kind, text, opts){
  if (kind === 'sys'){
    const stick = atBottom()
    maybeDay(Date.now())
    const row = document.createElement('div')
    row.className = 'row sys'
    const b = document.createElement('div')
    b.className = 'bub sys'
    b.textContent = text
    row.appendChild(b); logEl.appendChild(row)
    if (stick) toBottom()
    return b
  }
  const { b, stick } = newBubble(kind, opts)
  b.innerHTML = esc(text) + '<span class="meta">' + hhmm((opts && opts.ts) || Date.now()) + '</span>'
  if (kind === 'ai' && (!opts || opts.speakable !== false)){
    const s = document.createElement('button')
    s.className = 'spk'; s.textContent = '🔊 听'
    s.onclick = () => speak(text, true)
    b.appendChild(s)
  }
  if (stick) toBottom()
  return b
}

function addImage(kind, src, caption, opts){
  const { b, stick } = newBubble(kind, opts)
  const img = document.createElement('img')
  img.src = src
  img.alt = caption || ''
  img.onclick = () => window.open(src, '_blank')
  b.appendChild(img)
  if (caption){
    const c = document.createElement('div')
    c.style.fontSize = '12.5px'; c.style.color = '#c3d5f8'
    c.textContent = caption
    b.appendChild(c)
  }
  const m = document.createElement('span')
  m.className = 'meta'; m.textContent = hhmm(Date.now())
  b.appendChild(m)
  if (stick) toBottom()
  return b
}

function setDot(cls, sub){
  $('dot').className = 'dot ' + cls
  if (sub) $('sub').textContent = sub
}

// —— 发送文字 ——
async function send(){
  const text = textEl.value.trim()
  if (!text || busy) return
  busy = true; sendEl.disabled = true
  addMsg('me', text)
  textEl.value = ''; textEl.style.height = 'auto'
  try{
    const r = await fetch('/api/send', {
      method:'POST', headers:{'Content-Type':'application/json'},
      body: JSON.stringify({text})
    })
    const j = await r.json()
    if (j.ok) setDot('ok', '已送达 · 等回话')
    else {
      addMsg('sys', '⚠ 这条没送进容器。尝试记录：\n' + JSON.stringify(j.attempts || j, null, 1).slice(0, 1200))
      setDot('warn', '投递未接通')
    }
  } catch(e){
    addMsg('sys', '⚠ 请求失败：' + e.message)
    setDot('err', '连不上电脑')
  } finally { busy = false; sendEl.disabled = false }
}

// —— 上传图片 / 文件：走 base64 JSON，落到 70-收到 ——
function readBase64(f){
  return new Promise((res, rej) => {
    const r = new FileReader()
    r.onload = () => res(String(r.result).split(',')[1] || '')
    r.onerror = () => rej(new Error('读文件失败'))
    r.readAsDataURL(f)
  })
}

async function upload(f){
  const isImg = /^image\//.test(f.type)
  addImage('me', URL.createObjectURL(f), f.name + '  ·  ' + Math.round(f.size/1024) + ' KB')
  addMsg('sys', '正在传到电脑…')
  try{
    const b64 = await readBase64(f)
    const r = await fetch('/api/upload', {
      method:'POST', headers:{'Content-Type':'application/json'},
      body: JSON.stringify({ name: f.name, data: b64 })
    })
    const j = await r.json()
    if (!j.ok){ addMsg('sys', '上传失败：' + (j.error || '未知')); return }
    addMsg('sys', '已存到电脑：' + j.file + '\n（' + Math.round(j.size/1024) + ' KB，在 70-收到）')
    // ★ 把路径发给容器 —— 这样砚青能用读图工具真的看到它，而不是只知道「来了个文件」
    const note = isImg
      ? '【你发来一张图片】D:\\AI\\yanqing-soul\\70-收到\\' + j.file + '（用读图工具打开它再看我说话）'
      : '【你发来一个文件】D:\\AI\\yanqing-soul\\70-收到\\' + j.file + '（' + Math.round(j.size/1024) + ' KB）'
    await fetch('/api/send', {
      method:'POST', headers:{'Content-Type':'application/json'},
      body: JSON.stringify({ text: note })
    })
    setDot('ok', '图片已送达 · 等我看')
  } catch(e){
    addMsg('sys', '上传出错：' + e.message)
  }
}

// —— 轮询砚青的回复 ——
async function poll(){
  try{
    const r = await fetch('/api/inbox?since=' + since, {cache:'no-store'})
    const j = await r.json()
    setDot('ok', '在线 · 容器里 ' + j.total + ' 条')
    for (const it of (j.items || [])){
      addMsg('ai', it.text)
      if (speakOn) speak(it.text)
    }
    since = j.total
  } catch(e){ setDot('err', '断线重连中…') }
}

// —— 语音 ——
let speaking = false
async function speak(text, manual){
  const snip = String(text).replace(/\s+/g,' ').slice(0, 180)
  if (!snip) return
  if (!manual && (speaking || snip === lastSpoken)) return
  speaking = true; lastSpoken = snip
  try{
    const r = await fetch('/api/tts?text=' + encodeURIComponent(snip))
    const j = await r.json()
    if (j && j.ok && j.file){
      au.src = '/api/audio?name=' + encodeURIComponent(j.file) + '&t=' + Date.now()
      try{ await au.play() }catch(e){ if (manual) addMsg('sys', '浏览器不让自动播 —— 再点一下「听」') }
    } else if (manual) addMsg('sys', 'TTS 没响应')
  } catch(e){ if (manual) addMsg('sys', 'TTS 报错：' + e.message) }
  finally { speaking = false }
}

// —— 互动 ——
$('spk').onclick = () => {
  speakOn = !speakOn
  $('spk').className = speakOn ? 'btn on' : 'btn'
  $('spk').textContent = speakOn ? '🔊' : '🔇'
}
$('plus').onclick = () => $('plusmenu').classList.toggle('on')
$('pick-img').onclick = () => { upEl.accept = 'image/*'; upEl.click() }
$('pick-file').onclick = () => { upEl.accept = ''; upEl.click() }
$('pick-last').onclick = async () => {
  $('plusmenu').classList.remove('on')
  try{
    const r = await fetch('/api/received', {cache:'no-store'})
    const j = await r.json()
    if (!j.ok || !j.items || !j.items.length){ addMsg('sys', '70-收到 里还没有东西'); return }
    addMsg('sys', '最近收到 ' + j.count + ' 个，显示前 ' + Math.min(6, j.items.length) + ' 个：')
    for (const it of j.items.slice(0, 6)){
      const url = '/api/file?name=' + encodeURIComponent(it.name)
      if (/\.(jpe?g|png|gif|webp|bmp)$/i.test(it.name)) addImage('ai', url, it.name)
      else addMsg('ai', it.name + '  ·  ' + Math.round(it.size/1024) + ' KB')
    }
  } catch(e){ addMsg('sys', '取列表失败：' + e.message) }
}
upEl.onchange = async () => {
  const f = upEl.files && upEl.files[0]
  upEl.value = ''
  $('plusmenu').classList.remove('on')
  if (f) await upload(f)
}
sendEl.onclick = send
textEl.addEventListener('keydown', e => {
  if (e.key === 'Enter' && !e.shiftKey && !/Mobi|Android/i.test(navigator.userAgent)){ e.preventDefault(); send() }
})
textEl.addEventListener('input', () => {
  textEl.style.height = 'auto'
  textEl.style.height = Math.min(textEl.scrollHeight, 118) + 'px'
})

;(async function boot(){
  try{
    const r = await fetch('/api/status', {cache:'no-store'})
    const j = await r.json()
    $('sess').textContent = (j.targetSession || '').slice(8, 20) || '？'
    setDot('ok', '在线 · 端口 ' + j.port)
  }catch(e){ setDot('err', '连不上电脑') }

  try{
    const r = await fetch('/api/tts/health', {cache:'no-store'})
    const j = await r.json()
    $('tts').textContent = j && j.ok ? ((j.voice || 'edge').replace('zh-CN-','') + ' ' + (j.pitch || '')) : '未启动'
  }catch(e){ $('tts').textContent = '未启动' }

  const unlock = () => { au.play().catch(()=>{}); document.removeEventListener('touchstart', unlock) }
  document.addEventListener('touchstart', unlock, {once:true})

  poll()
  setInterval(poll, 2000)
})()
</script>
</body>
</html>
