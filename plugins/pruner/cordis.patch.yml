# dsh bundle patch: 把本插件插进 profile 的层栈。
#
# ★★★ 和 compaction 那份同样的问题，完整理由见 `../compaction/cordis.patch.yml`。
#
# 一句话：**patch 是扁平的 `{ id, name, ...overrides }`，没有 `update` 关键字，
# 而且 `name` 有一致性校验**（`cordis-plugin-include/lib/index.js:68-104`）。
# 所以「用同一个 id 把实体换掉」在 patch 层是封死的 —— 写了也不生效，
# 只会得到 `patch: id is required for non-insert patches` 这一句 warning。
#
# 下面走 `insert`，把本包作为新的一层挂上去。
#
# ★★ 2026-10-22 补正（和 compaction 那条一模一样，已实测）：
#   本包和内置的 `tool-result-pruner` **抢同一个服务名 `toolResultPruner`**，
#   cordis 先到先得、后来的不生效。只把本包排到前面**不够** ——
#   必须同时在 profile 的 cordis.patch.yml 里把内置的禁掉：
#
#     - id: tool-result-pruner
#       disabled: true
#
#   ★ 少这一步的后果**和 compaction 不同**：compaction 那样会明确报
#     service "compaction" has been registered；pruner 这边报的是
#     service "toolResultPruner" has been registered —— 但工具结果裁剪**照样在跑**，
#     只是那块被挖掉的内容**不带 seq 门牌**。也就是「静默地少了一半门牌」。
#
# ★ 验法（四条一起看，详见 ../compaction/HOW-TO-TAKEOVER.md）：
#   ① 启动日志没有 service "toolResultPruner" has been registered
#   ② 跑一次工具结果裁剪：被挖掉那块是**带 seq 的门牌**，不是内置那句静态 marker
#   ③ 把上面的 disabled 去掉再跑一次，确认现象真的变回去（反向验证）
#   ④ 门牌里的指针能被 memq 打开（判据在 compaction 那份文档里）
- insert:
    - id: dsh-agent-pruner
      name: 'dsh-agent-pruner'
