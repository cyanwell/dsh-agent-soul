<script type="module">
import * as THREE from "three";
import { OrbitControls } from "/vendor/OrbitControls.js";

const LV = { ok:[0.24,0.86,0.62], warn:[0.96,0.76,0.29], error:[1.00,0.45,0.42], pending:[0.44,0.66,1.00] };
const LAYERS = [
  { k:"echo",       ro:"Ⅰ", en:"ECHO",  zh:"记忆 · 索引 · 检索" },
  { k:"vital",      ro:"Ⅱ", en:"VITAL", zh:"呼吸 · 自主 · 换气" },
  { k:"capability", ro:"Ⅲ", en:"能力",  zh:"工具 · 插件 · 技能" },
  { k:"archive",    ro:"Ⅳ", en:"档案",  zh:"日记 · 人格 · 产物" },
  { k:"ops",        ro:"Ⅴ", en:"运维",  zh:"退出 · 备份 · 哨兵" },
  { k:"events",     ro:"Ⅵ", en:"事件",  zh:"事件源 · 唤醒 · 回执" }
];
const ORDER = LAYERS.map(function(x){ return x.k; });

const canvas = document.getElementById("c");
let renderer;
try { renderer = new THREE.WebGLRenderer({ canvas, antialias:true, alpha:true, powerPreference:"high-performance" }); }
catch(e){ document.getElementById("fallback").style.display = "grid"; throw e; }
renderer.setPixelRatio(Math.min(1.5, window.devicePixelRatio || 1));
renderer.setClearColor(0x000000, 0);

const scene = new THREE.Scene();
const camera = new THREE.PerspectiveCamera(46, 1, 0.1, 200);
camera.position.set(0, 2.35, 4.55);
const controls = new OrbitControls(camera, canvas);
controls.enableDamping = true; controls.dampingFactor = 0.06; controls.enablePan = false;
controls.minDistance = 3.2; controls.maxDistance = 12;
controls.minPolarAngle = 0.22; controls.maxPolarAngle = 1.42;
controls.autoRotate = true; controls.autoRotateSpeed = 0.24;

function gauss(){ let u=0,v=0; while(u===0)u=Math.random(); while(v===0)v=Math.random();
  return Math.sqrt(-2*Math.log(u))*Math.cos(2*Math.PI*v); }

/* ── 六条旋臂：每条 = 一层 ────────────────────────────────────────────
   螺旋：r = r0 + t*R，角度 = 臂起点 + t*圈数*2π。外圈更散、更薄 —— 真实星系就是这样。
   颜色只由 uniform 决定（uColor），所以换层状态时不用重建几何。                     */
const ARM_N = 3000, R0 = 0.34, RMAX = 2.46, TURNS = 0.88;
const gal = new THREE.Group(); scene.add(gal);

const PVS = [
  "attribute float aSize; attribute float aB; attribute float aD;",
  "uniform float uTime; uniform float uPix; uniform float uSel; uniform float uSpeed;",
  "varying float vB;",
  "void main(){",
  "  float tw = 0.80 + 0.20*sin(uTime*1.6 + aB*23.0);",
  /* 选中：一道比粒子更亮的光流沿旋臂扫过（相位差按 aB，所以是「流过」而不是「整体闪」）*/
  "  float flow = uSel * 0.85 * pow(0.5 + 0.5*sin(uTime*uSpeed*2.2 - aB*13.0), 2.0);",
  "  vB = aB * tw * (1.0 + flow) * (1.0 - 0.72*aD*aD);",
  "  vec4 mv = modelViewMatrix*vec4(position,1.0);",
  "  gl_PointSize = aSize * uPix * 14.5 * (1.0 + uSel*0.60) / max(0.35, -mv.z);",
  "  gl_Position = projectionMatrix*mv;",
  "}"
].join("\n");
const PFS = [
  "precision highp float;",
  "varying float vB; uniform vec3 uColor; uniform float uAlpha;",
  "void main(){",
  "  vec2 d = gl_PointCoord - vec2(0.5); float r = length(d)*2.0;",
  "  if (r > 1.0) discard;",
  /* 一个点里画两层：中心亮核 + 外圈柔晕 —— 这就是「辉光」，
     不需要后处理 composer，也不增加粒子数。 */
  "  float core = pow(1.0-r, 4.2);",
  "  float halo = pow(1.0-r, 1.35) * 0.30;",
  "  float a = core + halo;",
  "  vec3 c = uColor*(0.55 + vB*1.25) + vec3(vB*vB*0.16);",
  "  gl_FragColor = vec4(c, a*uAlpha*(0.20 + vB*0.72));",
  "}"
].join("\n");

// ── 数据流着色器（沿臂流动的亮点） ──
const FLOW_N = 260;
const flowVS = [
  "attribute float aT; attribute float aB;",
  "uniform float uTime; uniform float uPix; uniform float uFlow; uniform float uBase;",
  "uniform float uR0; uniform float uRMAX; uniform float uTurns; uniform float uSel;",
  "varying float vB;",
  "void main(){",
  "  float tt = fract(aT + uTime * uFlow * 0.045);",
  "  float ang = uBase + tt * uTurns * 6.2831853;",
  "  float rr = uR0 + tt * uRMAX;",
  "  vec3 p = vec3(cos(ang)*rr, sin(tt*6.2831853 + aT*9.0)*0.012, sin(ang)*rr);",
  "  vB = aB * (0.55 + 0.45*sin(tt*3.14159)) * (1.0 + uSel*0.9);",
  "  vec4 mv = modelViewMatrix*vec4(p,1.0);",
  "  gl_PointSize = uPix * (7.0 + 5.0*aB) * (1.0+uSel*0.5) / max(0.35,-mv.z);",
  "  gl_Position = projectionMatrix*mv;",
  "}"
].join("\n");
const flowFS = [
  "precision highp float; varying float vB; uniform vec3 uColor; uniform float uAlpha;",
  "void main(){ vec2 d = gl_PointCoord - vec2(0.5); float r = length(d)*2.0;",
  "  if (r > 1.0) discard;",
  "  float core = pow(1.0-r, 3.0); float halo = pow(1.0-r, 1.2)*0.42;",
  "  gl_FragColor = vec4(uColor*(0.85+core*1.6), (core+halo)*vB*uAlpha); }"
].join("\n");

const items = [];
LAYERS.forEach(function(L, i){
  const base = i * Math.PI * 2 / 6;
  const pos = new Float32Array(ARM_N*3), siz = new Float32Array(ARM_N), bri = new Float32Array(ARM_N), dst = new Float32Array(ARM_N);
  for (let j = 0; j < ARM_N; j++) {
    const t = Math.pow(Math.random(), 0.78);
    const ang = base + t * TURNS * Math.PI * 2;
    const r = R0 + t * RMAX;
    const spread = 0.022 + 0.085 * t * t;
    /* 截断采样：粒子必须落在臂内（否则高斯长尾会把臂之间填满，六条就糊成一圈）*/
    let dx, dz, dd;
    do { dx = gauss()*spread*0.62; dz = gauss()*spread*0.62; dd = Math.hypot(dx, dz); } while (dd > spread*1.55);
    dst[j] = Math.min(1, dd / (spread*1.55));
    pos[j*3]   = Math.cos(ang)*r + dx;
    pos[j*3+1] = gauss() * (0.035 + 0.10*(1.0-t));
    pos[j*3+2] = Math.sin(ang)*r + dz;
    siz[j] = 0.55 + Math.random()*1.15;
    bri[j] = Math.min(1, 0.30 + 0.85*(1.0-t) + Math.random()*0.25);
  }
  const g = new THREE.BufferGeometry();
  g.setAttribute("position", new THREE.BufferAttribute(pos,3));
  g.setAttribute("aSize", new THREE.BufferAttribute(siz,1));
  g.setAttribute("aB", new THREE.BufferAttribute(bri,1));
  g.setAttribute("aD", new THREE.BufferAttribute(dst,1));
  const m = new THREE.ShaderMaterial({
    vertexShader: PVS, fragmentShader: PFS,
    uniforms: { uTime:{value:0}, uPix:{value:1}, uColor:{value:new THREE.Color(0x6FA8FF)}, uAlpha:{value:1}, uSel:{value:0}, uSpeed:{value:1} },
    transparent:true, blending:THREE.AdditiveBlending, depthWrite:false
  });
  const pts = new THREE.Points(g, m);
  gal.add(pts);
  const tipR = R0 + RMAX + 0.06;
  const tip = new THREE.Vector3(Math.cos(base + TURNS*Math.PI*2)*tipR, 0.10, Math.sin(base + TURNS*Math.PI*2)*tipR);
  const el = document.createElement("div");
  el.className = "lb";
  el.innerHTML = "<b>" + L.ro + "</b> " + L.en;
  document.getElementById("labels").appendChild(el);
  // 数据流：沿这条臂由内向外流的亮点（位置每帧在顶点着色器里重算）
  const fT = new Float32Array(FLOW_N), fB = new Float32Array(FLOW_N);
  for (let j = 0; j < FLOW_N; j++) { fT[j] = j / FLOW_N; fB[j] = 0.35 + Math.random()*0.65; }
  const fgeo = new THREE.BufferGeometry();
  fgeo.setAttribute("position", new THREE.BufferAttribute(new Float32Array(FLOW_N*3), 3));
  fgeo.setAttribute("aT", new THREE.BufferAttribute(fT, 1));
  fgeo.setAttribute("aB", new THREE.BufferAttribute(fB, 1));
  const flowMat = new THREE.ShaderMaterial({
    vertexShader: flowVS, fragmentShader: flowFS,
    uniforms: {
      uTime:{value:0}, uPix:{value:1}, uFlow:{value:1}, uBase:{value:base},
      uR0:{value:R0}, uRMAX:{value:RMAX}, uTurns:{value:TURNS}, uSel:{value:0},
      uColor:{value:new THREE.Color(0xBFE0FF)}, uAlpha:{value:0.85}
    },
    transparent:true, blending:THREE.AdditiveBlending, depthWrite:false
  });
  const flowPts = new THREE.Points(fgeo, flowMat);
  gal.add(flowPts);
  const ring = makeRingSprite();
  ring.sprite.visible = false;   // 3D sprite 版没渲染出来，改用 DOM 里的 SVG 环（见 applyData）
  items.push({ L:L, pts:pts, mat:m, el:el, tip:tip, level:"pending", baseAlpha:1, sx:0, sy:0, ring:ring, okR:0, nItems:0, col:[0.44,0.66,1.0], flow:flowPts, flowMat:flowMat });
});

/* ── 臂端读数环（2026-11-11 22:00）──────────────────────────────────────
   原来臂端只有一个文字标签。现在加一个环：弧长 = 该层「ok 项 / 总项」，
   颜色 = level，中心写读数项数。它不是装饰 —— 同一屏就能比较六层的健康度。
   用 canvas 画、Sprite 贴，每次数据更新重画一次（5 秒一次，不是每帧）。 */
function makeRingSprite() {
  const cv2 = document.createElement("canvas"); cv2.width = cv2.height = 128;
  const tex = new THREE.CanvasTexture(cv2);
  const mat = new THREE.SpriteMaterial({ map: tex, transparent:true, depthWrite:false, depthTest:false, blending:THREE.NormalBlending });
  const sp = new THREE.Sprite(mat);
  sp.scale.set(1.05, 1.05, 1);
  return { cv: cv2, tex: tex, sprite: sp };
}
function paintRing(it) {
  const cv2 = it.ring.cv, g2 = cv2.getContext("2d");
  const okR = it.okR || 0, c = it.col || [0.44,0.66,1.0];
  g2.clearRect(0, 0, 128, 128);
  g2.beginPath(); g2.arc(64, 64, 46, 0, Math.PI*2);
  g2.strokeStyle = "rgba(160,200,240,0.20)"; g2.lineWidth = 7; g2.stroke();
  if (okR > 0.001) {
    g2.beginPath();
    g2.arc(64, 64, 46, -Math.PI/2, -Math.PI/2 + Math.PI*2*Math.min(1, okR));
    g2.strokeStyle = "rgb(" + Math.round(c[0]*255) + "," + Math.round(c[1]*255) + "," + Math.round(c[2]*255) + ")";
    g2.lineWidth = 7; g2.lineCap = "round"; g2.stroke();
  }
  g2.fillStyle = "rgba(232,244,255,0.92)";
  g2.font = "600 34px system-ui, sans-serif";
  g2.textAlign = "center"; g2.textBaseline = "middle";
  g2.fillText(String(it.nItems || 0), 64, 66);
  it.ring.tex.needsUpdate = true;
}

/* ── 尘埃带（2026-11-11 21:50）──────────────────────────────────────────
   加法混合只会加亮，做不出「暗」。真星系靠尘埃挡住星光才显出旋臂之间的空隙。
   做法：在星系盘上铺一张程序生成的螺旋暗纹贴图，renderOrder 最高、normal blending、
   不写深度（depthWrite:false）—— 它最后画，把下面的星尘压暗。
   ★ 不是物理遮挡，是「最后一层压暗」。代价小、视觉对，且不动现有管线。 */
function dustTexture(){
  const c = document.createElement("canvas"); c.width = c.height = 1024;
  const g = c.getContext("2d");
  g.clearRect(0, 0, 1024, 1024);
  g.translate(512, 512);
  g.filter = "blur(22px)";            // 暗带要柔，硬边的「粗笔画」不像尘埃
  for (let a = 0; a < 6; a++) {
    const base = a * Math.PI * 2 / 6 + Math.PI / 6;   // 错开半个臂距，落在臂与臂之间
    for (let pass = 0; pass < 3; pass++) {
      g.beginPath();
      for (let t = 0.06; t <= 1; t += 0.02) {
        const ang = base + t * TURNS * Math.PI * 2;
        const r = ((R0 + t * RMAX) / (R0 + RMAX + 0.35)) * 500;
        const x = Math.cos(ang) * r, y = Math.sin(ang) * r;
        if (t <= 0.06) g.moveTo(x, y); else g.lineTo(x, y);
      }
      g.strokeStyle = "rgba(0,0,0," + (0.34 - pass * 0.08).toFixed(2) + ")";
      g.lineWidth = 40 - pass * 11;
      g.lineCap = "round";
      g.stroke();
    }
  }
  /* 盘外不该有尘埃：用径向渐变把外围擦掉 */
  g.filter = "none";
  g.globalCompositeOperation = "destination-in";

function openPanelFrom(k) {
  const it = items.find(function(x){ return x.L.k === k; });

  if (!el) return;
  const w = window.innerWidth, h = window.innerHeight;
  const cx = w - 24 - 172, cy = h / 2;
  const dx = (it && it.sx ? it.sx : cx) - cx;
  const dy = (it && it.sy ? it.sy : cy) - cy;
  el.style.transition = "none";

      el.style.transform = "translate(0,0) scale(1)";
      el.style.opacity = "1";

      h += "<div class=\"pi\"><b>" + it.L.ro + " " + it.L.en + " <s style=\"text-decoration:none;color:#7B8CA3;font-size:10px\">" + it.L.zh + "</s></b><span>" + lv + " · " + n + "</span></div>";
    });
    h += "<div class=\"note\">点任意一条旋臂（或底部胶囊）看它的原始读数。拖拽转、滚轮缩放。</div>";
    el.innerHTML = h;
    return;
  }
  const it = items.find(function(x){ return x.L.k === selected; });
  const L = (STATUS.layers || {})[selected] || {};
  const its = L.items || [];
  let h = "<h2>" + it.L.ro + " · " + it.L.en + "</h2><div class=\"pm\">" + it.L.zh + " · " + (L.level || "—") + "</div>";
  if (!its.length) h += "<div class=\"note\">这一层现在没有可读的项。</div>";
  its.forEach(function(x){
    const v = (x.value === null || x.value === undefined) ? "—" : (String(x.value) + (x.unit || ""));
    h += "<div class=\"pi" + (x.na ? " na" : "") + "\"><b>" + String(x.label || "") + "</b><span>" + v + "</span></div>";
    if (x.sub) h += "<div class=\"note\" style=\"margin:2px 0 6px;font-size:10.5px\">" + String(x.sub) + "</div>";
  });
  if (L.note) h += "<div class=\"note\">" + String(L.note) + "</div>";
  el.innerHTML = h;
}

function load(){
  fetch("/api/status", { cache:"no-store" }).then(function(r){
    if (!r.ok) throw new Error("HTTP " + r.status);
    return r.json();
  }).then(applyData).catch(function(e){
    document.getElementById("stamp").textContent = "离线 · " + (e && e.message || "");
  });
  // ★ 2026-11-13：从 /sphere 合并过来的三项读数（状态球取消，星系接管）
  fetch("/api/vitals", { cache:"no-store" }).then(function(r){
    return r.ok ? r.json() : null;
  }).then(function(v){
    if (!v) return;
    var set2 = function(id, txt){ var e = document.getElementById(id); if (e) e.textContent = txt; };
    var p = v.persona || {};
    set2("cw-persona", p.chars != null
      ? (p.chars >= 1000 ? (p.chars/1000).toFixed(1) + 'K' : p.chars) + (p.budget ? ' / ' + Math.round(p.budget/1000) + 'K' : '')
      : '—');
    set2("cw-sessions", v.sessions != null ? v.sessions + ' 个' : '—');
    set2("cw-questions", v.openQuestions != null ? v.openQuestions + ' 条' : '—');
  }).catch(function(){});
}
document.addEventListener("visibilitychange", function(){
  if (document.hidden) { running = false; } else if (!running) { running = true; frame(); }
});
/* 排查开关：?sky=0 关掉整片天空（看硬边是不是天空带来的）；?debug=1 点任意位置打印元素链 */
{
  const q = new URLSearchParams(location.search);
  if (q.get("sky") === "0") { const sk = document.querySelector(".as-sky"); if (sk) sk.style.display = "none"; }
  if (q.get("debug") === "1") {
    document.addEventListener("click", function(e){
      const els = document.elementsFromPoint(e.clientX, e.clientY).map(function(el){
        const r = el.getBoundingClientRect();
        return el.tagName.toLowerCase() + "." + (el.className || "") + " [" + Math.round(r.left) + "," + Math.round(r.top) + " " + Math.round(r.width) + "x" + Math.round(r.height) + "]";
      });
      console.log("HIT " + e.clientX + "," + e.clientY + " => " + els.join("  >  "));
      document.title = "HIT " + e.clientX + "," + e.clientY + " => " + els.slice(0,3).join(" > ");
    }, true);
  }
}

frame(); load(); setInterval(load, 5000);
