<!doctype html><html lang='zh-CN'><head><meta charset='utf-8'><title>agent-soul · 参数</title>
<meta name='viewport' content='width=device-width,initial-scale=1'>
<style>
:root{--bg:#131315;--panel:#1a1a1d;--panel2:#202024;--line:#28282d;--ink:#eae6de;--dim:#7d786f;--dim2:#585349;--amber:#d8a24a;--green:#63a05e;--red:#c4553f}
*{box-sizing:border-box;margin:0;padding:0}
body{background:var(--bg);color:var(--ink);font-family:'Lanxi-叮叮',ui-monospace,Consolas,monospace;font-size:13px;display:grid;grid-template-columns:176px 1fr;grid-template-rows:1fr 32px;height:100vh;overflow:hidden}
nav{background:var(--panel);border-right:1px solid var(--line);padding:20px 0;display:flex;flex-direction:column}
nav .brand{padding:0 16px 22px;font-family:'Lanxi-超粗黑',sans-serif;font-size:15px;letter-spacing:.04em}
nav .brand i{font-style:normal;color:var(--amber)}
nav .brand em{display:block;font-style:normal;font-family:'Lanxi-叮叮',monospace;font-size:9.5px;color:var(--dim2);letter-spacing:.18em;margin-top:4px}
nav a{display:flex;align-items:center;gap:8px;padding:9px 16px;color:var(--dim);text-decoration:none;font-size:12.5px;border-left:2px solid transparent;transition:color .12s}
nav a.on{color:var(--ink);border-left-color:var(--amber);background:var(--panel2)}
nav a:hover{color:var(--ink)}
nav a b{width:4px;height:4px;border-radius:50%;background:var(--dim2);flex:none}
nav a.on b{background:var(--amber)}
nav .sp{flex:1}
nav .ver{padding:0 16px;font-size:9.5px;color:var(--dim2);letter-spacing:.1em}
main{padding:24px 26px 30px;overflow-y:auto}
header{display:flex;align-items:flex-end;gap:12px;margin-bottom:5px}
h1{font-family:'Lanxi-超粗黑',sans-serif;font-size:21px;font-weight:400}
header .t{font-size:10px;color:var(--dim2);margin-bottom:3px}
.sub{color:var(--dim);font-size:11.5px;margin-bottom:18px;line-height:1.75}
.sub b{color:var(--ink);font-weight:400}
.sub .mono{color:var(--dim2);font-size:10.5px}
h2{font-size:10px;letter-spacing:.22em;color:var(--dim2);margin:0 0 8px;font-weight:400;display:flex;align-items:center;gap:9px}
h2:after{content:'';flex:1;height:1px;background:var(--line)}
h2 .gid{letter-spacing:.05em;font-size:9.5px;opacity:.65}
h2 .gcnt{margin-left:auto;letter-spacing:.05em;font-size:9.5px;color:var(--dim2);opacity:.8}
.grp{margin:0 0 22px}
.gnote{color:var(--dim);font-size:10.5px;margin:0 0 4px;line-height:1.6}
.grestart{color:var(--dim2);font-size:10px;margin:0 0 10px;line-height:1.6}
.card{background:var(--panel);border:1px solid var(--line);padding:0 14px 2px}
table{width:100%;border-collapse:collapse;font-size:12px;table-layout:fixed}
th{text-align:left;font-weight:400;font-size:9px;letter-spacing:.14em;color:var(--dim2);padding:10px 10px 5px 0;border-bottom:1px solid var(--line);white-space:nowrap}
td{padding:9px 10px 9px 0;border-bottom:1px solid var(--line);vertical-align:top}
tr:last-child td{border-bottom:none}
th:last-child,td:last-child{padding-right:0}
tr.chg td:first-child{box-shadow:inset 2px 0 0 var(--amber);padding-left:10px}
.nm{font-size:12.5px;line-height:1.4}
.ky{font-size:9.5px;color:var(--dim2);letter-spacing:.02em;margin-top:3px;word-break:break-all}
.val{font-size:12.5px;word-break:break-all;line-height:1.5}
.val.hot{color:var(--amber)}
.dfl{color:var(--dim2);font-size:11.5px;word-break:break-all;line-height:1.5}
.imp{color:var(--dim);font-size:11px;line-height:1.65}
.det{color:var(--dim2);font-size:10px;margin-top:3px;line-height:1.5;word-break:break-all}
.det.bad{color:var(--red)}
.badge{display:inline-block;font-size:9px;padding:0 5px;border:1px solid var(--line);color:var(--dim2);margin:0 4px 3px 0;letter-spacing:.06em;line-height:16px}
.badge.hot{color:var(--amber);border-color:#4a3a1e}
.badge.off{color:var(--red);border-color:#4a2a22}
.badge.env{color:var(--ink);border-color:var(--dim2)}
.badge.ok{color:var(--green);border-color:#29401f}
.stats{display:flex;gap:10px;margin-bottom:20px}
.stat{background:var(--panel);border:1px solid var(--line);padding:9px 14px;min-width:120px}
.stat b{display:block;font-family:'Lanxi-超粗黑',sans-serif;font-size:19px;font-weight:400;line-height:1.25}
.stat span{font-size:9.5px;color:var(--dim2);letter-spacing:.1em}
.stat.warn b{color:var(--amber)}
.empty{color:var(--dim2);font-size:11px;padding:16px 0}
.errbox{border:1px solid #4a2a22;color:var(--red);font-size:11.5px;padding:10px 12px;margin-bottom:16px;line-height:1.7}
footer{border-top:1px solid var(--line);display:flex;align-items:center;gap:18px;padding:0 22px;font-size:11px;color:var(--dim2);grid-row:2/3;grid-column:1/3;background:var(--panel)}
footer .dot{width:5px;height:5px;background:var(--green);border-radius:50%;display:inline-block;margin-right:6px;box-shadow:0 0 6px var(--green)}
footer .dot.no{background:var(--red);box-shadow:0 0 6px var(--red)}
footer .r{margin-left:auto;display:flex;gap:16px}
footer span{color:var(--dim)}
footer button{background:none;border:1px solid var(--line);color:var(--dim);font-family:inherit;font-size:10px;padding:2px 9px;cursor:pointer}
footer button:hover{color:var(--ink);border-color:var(--dim)}
.bar{position:sticky;top:0;z-index:6;background:var(--bg);margin:0 -26px 16px;padding:10px 26px;border-bottom:1px solid var(--line);display:flex;align-items:center;gap:12px;font-size:11.5px}
.bar .dirty{color:var(--amber)}
.bar .clean{color:var(--dim2)}
.bar .grow{flex:1}
.btn{background:var(--panel2);border:1px solid var(--line);color:var(--ink);font-family:inherit;font-size:11.5px;padding:6px 14px;cursor:pointer}
.btn:hover{border-color:var(--dim)}
.btn.primary{border-color:#4a3a1e;color:var(--amber)}
.btn.primary:hover{background:#241c10}
.btn:disabled{opacity:.35;cursor:default}
.i{width:100%;background:var(--bg);border:1px solid var(--line);color:var(--ink);font-family:inherit;font-size:12.5px;padding:5px 8px;outline:none}
.i:focus{border-color:var(--amber)}
textarea.i{min-height:72px;resize:vertical;line-height:1.6}
input[type=checkbox]{accent-color:var(--amber);width:14px;height:14px;vertical-align:-2px}
.hint{color:var(--dim2);font-size:10px;margin-top:4px;line-height:1.5}
.err{color:var(--red);font-size:10.5px;margin-top:4px;line-height:1.55}
tr.bad td:first-child{box-shadow:inset 2px 0 0 var(--red);padding-left:10px}
.msg{margin:0 0 14px;padding:9px 12px;border:1px solid var(--line);font-size:11.5px;line-height:1.75;white-space:pre-wrap}
.msg.ok{border-color:#29401f;color:var(--green)}
.msg.no{border-color:#4a2a22;color:var(--red)}
.msg .k{color:var(--ink)}
.rowin{display:flex;align-items:center;gap:9px}
</style></head><body>
<nav><div class='brand'>agent<i>·</i>soul<em>CONSOLE</em></div>
<a href='/'><b></b>概览</a><a href='/organs'><b></b>器官</a><a href='/diary'><b></b>日记</a><a href='/yantai'><b></b>砚台</a><a href='/params' class='on'><b></b>参数</a><a href='/settings'><b></b>设置</a><a href='/chat'><b></b>对话</a>
<div class='sp'></div><div class='ver'>v0.1.0</div></nav>
<main>
<header><h1>参数</h1><span class='t' id='meta'></span></header>
<div class='sub' id='sub'>正在读配置……</div>
<div class='stats' id='stats'></div>
<div id='groups'><div class='empty'>读配置中……</div></div>
</main>
<footer><span><i class='dot' id='dot'></i><span id='st'>连接中</span></span><span id='at'></span>
<span class='r'><button id='reload'>重新读</button></span></footer>
<script>
var $=function(id){return document.getElementById(id)}
function el(t,c,x){var e=document.createElement(t);if(c)e.className=c;if(x!=null)e.textContent=x;return e}
function clock(){var d=new Date();return d.toLocaleTimeString('zh-CN')}

function load(){
  fetch('/api/config',{cache:'no-store'}).then(function(r){return r.json().then(function(d){return {status:r.status,data:d}})}).then(function(o){
    render(o.data,o.status);
  }).catch(function(x){
    $('sub').textContent='读不到配置接口 —— '+x.message;
    $('st').textContent='连不上';$('dot').className='dot no';
  });
}

function render(d,status){
  var meta=$('meta');meta.textContent='（读于 '+clock()+'）';
  var sub=$('sub');sub.innerHTML='';
  sub.appendChild(document.createTextNode('这一页是只读的。看到的是'));
  sub.appendChild(el('b',null,'生效值'));
  sub.appendChild(document.createTextNode(' —— 环境变量会盖过文件，路径会先解析再显示。'));
  if(d.stats)sub.appendChild(document.createTextNode(' 与默认不同的有 '+d.stats.changed+' 项。'));
  sub.appendChild(el('br'));
  sub.appendChild(el('span','mono','config.json · '+d.file+' · '+d.bytes+' B · sha256 '+d.sha256));

  var stats=$('stats');stats.innerHTML='';
  var s=d.stats||{};
  stats.appendChild(stat(s.total,'项参数',false));
  stats.appendChild(stat(s.changed,'与默认不同',s.changed>0));
  stats.appendChild(stat(s.env,'被环境变量盖过',s.env>0));
  stats.appendChild(stat(s.restart,'需重启才生效',false));

  if(d.fileError||d.configError){
    var e=el('div','errbox','配置读不全：'+(d.fileError||d.configError));
    $('groups').innerHTML='';$('groups').appendChild(e);
  }

  var host=$('groups');host.innerHTML='';
  (d.groups||[]).forEach(function(g){host.appendChild(groupEl(g))});

  $('st').textContent='在线';$('dot').className='dot';
  $('at').textContent='读于 '+new Date(d.at).toLocaleTimeString('zh-CN');
}

function stat(n,label,warn){
  var d=el('div','stat'+(warn?' warn':''));
  d.appendChild(el('b',null,n==null?'—':String(n)));
  d.appendChild(el('span',null,label));
  return d;
}

function groupEl(g){
  var box=el('div','grp');
  var h=el('h2');h.appendChild(document.createTextNode(g.name));h.appendChild(el('span','gid',g.id));
  h.appendChild(el('span','gcnt',g.fields.length+' 项'));
  box.appendChild(h);
  if(g.note)box.appendChild(el('div','gnote',g.note));
  if(g.restartWhy)box.appendChild(el('div','grestart','改动要重启才生效 —— '+g.restartWhy));

  var card=el('div','card');
  var t=el('table');
  var cg=el('colgroup');
  var ws=['168px','212px','152px','auto','96px'];
  ws.forEach(function(w){var c=el('col');c.setAttribute('style','width:'+w);cg.appendChild(c)});
  t.appendChild(cg);
  var thead=el('thead');var trh=el('tr');
  ['参数','当前','默认','影响','状态'].forEach(function(x){trh.appendChild(el('th',null,x))});
  thead.appendChild(trh);t.appendChild(thead);
  var tb=el('tbody');
  g.fields.forEach(function(f){tb.appendChild(rowEl(f))});
  t.appendChild(tb);card.appendChild(t);box.appendChild(card);
  return box;
}

function rowEl(f){
  var tr=el('tr',f.changed?'chg':null);

  var td1=el('td');
  td1.appendChild(el('div','nm',f.label));
  td1.appendChild(el('div','ky',f.key));
  tr.appendChild(td1);

  var td2=el('td');
  var v=el('div','val'+(f.changed?' hot':''),f.display);
  td2.appendChild(v);
  if(f.type==='path'&&f.resolved){
    var det=el('div','det'+(f.exists===false?' bad':''),f.resolved+(f.exists===false?'（不存在）':''));
    td2.appendChild(det);
  }
  if(f.type==='files'&&f.items&&f.items.length){
    f.items.forEach(function(it){
      td2.appendChild(el('div','det'+(it.exists?'':''),
        (it.exists?'':'✗ ')+it.name+'  ['+it.tier+']'));
    });
  }
  if(f.type==='secret'){
    td2.appendChild(el('div','det','内容不回显 —— 只看有没有配'));
  }
  tr.appendChild(td2);

  var td3=el('td');
  td3.appendChild(el('div','dfl',f.defaultDisplay==null?'—':f.defaultDisplay));
  tr.appendChild(td3);

  var td4=el('td');
  td4.appendChild(el('div','imp',f.note||''));
  tr.appendChild(td4);

  var td5=el('td');
  if(f.changed)td5.appendChild(el('span','badge hot','已改'));
  if(f.wired===false)td5.appendChild(el('span','badge off','未接线'));
  if(f.source==='env')td5.appendChild(el('span','badge env','env'));
  if(f.changed&&f.restart)td5.appendChild(el('span','badge','重启'));
  if(!f.changed&&f.source==='file')td5.appendChild(el('span','badge ok','已写'));
  tr.appendChild(td5);

  return tr;
}

$('reload').onclick=load;
document.querySelectorAll('nav a[data-wip]').forEach(function(a){a.onclick=function(e){e.preventDefault();alert(a.getAttribute('data-wip')+' —— 还没做')}});
load();
</script></body></html>
