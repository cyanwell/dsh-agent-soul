- id: mnemon
  name: dsh-mnemon
  config:
    remoteAccess: read-only
    timeoutMs: 10000
    defaultRecallLimit: 10
    runtimeMemory:
      memoryLimitBytes: 11264
      userLimitBytes: 4096
      maintenanceMaxTokens: 8192
    embedding:
      enabled: false
      endpoint: http://localhost:11434
      model: nomic-embed-text
      protocol: auto
      apiKey: ""
    memoryView:
      strategyTypeId: default-three-tier
      entries:
        include:mnemon-strategy-auto-capture:
          config: {}
        include:mnemon-strategy-scoped:
          config: {}
    recallQuality:
      policy: strict-v1
      lowScoreThreshold: 0.25
      highScoreThreshold: 0.6
      candidateMultiplier: 3
      maxMediumResults: 4
      maxUnknownResults: 2
    routingGuidance: true
    tabEnabled: true
    writeEnabled: true
    lifecycleEnabled: true
    recallMode: guided
    writebackMode: guided
    idleReviewMs: 30000

