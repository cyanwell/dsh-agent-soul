# ── 换气 (dsh-huanqi) 的可调参数 ─────────────────────────────────────────
# 这些是「延续额度」那套东西的设置。改完要重启 DSH 才生效。
#   maxContinuations      一口气能接几次（同时也是额度上限）0 = 关掉换气层，只留循环检测
#   normalTurnThreshold   攒够多少「正常轮」额度 +1（正常轮 = 出了正文、没触发延续）
#   anomalyWindow         出正文后多少轮内又卡住，算一次异常（额度 −1）
#   warnAtCredit          额度降到几时开始提示
#   ledgerPath            账本落盘路径；留空 = <DSH_HOME>/state/dsh-huanqi.json
#   silentReasoningChars  流内早杀阈值：推理写到这么多字、正文与工具仍为零，就地截断
#                         ★ 2026-10-12 23:57 改：3000 → 8000（实测放宽）
#                         理由：3000 会误杀约 7.9% 的正常长推理（probe-loop 全量 7533 步实测，
#                         3000 字以上的正常步共 592 个），当晚实测被误截断 4 次、全是正常思考，
#                         额度被误耗到 0 导致熔断。放宽到 8000 后误杀率降到 0.37%。
#                         ★ 真正的主力是流末那层（reasoning-only + stalledRun >= reasoningOnlySteps）
#                         —— 全史 4 次循环全中、正常步零误报；流内这层只负责「别等它自己停」。
# ★★★ 2026-10-18：换气引擎在 0.2.1 上整个不加载。
#   两种情况要分清（这是文件头那句话：id-targeted **config overrides** + **insert lists**）：
#     · `- id: X`      = 覆盖**已存在**的条目 —— X 不存在时静默跳过，不报错
#     · `- insert: [ ]` = 新增条目
#   它自带的 bundle patch（`- insert: id huanqi / name dsh-huanqi`）在 0.2.1 上没生效，
#   于是 huanqi 这个 id 压根不存在 → 原来的 `- id: huanqi` 覆盖了个空气。
#   ⇒ 必须用 insert 真正把它插进树里。
